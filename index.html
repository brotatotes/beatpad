<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<meta name="description" content="Beat Pad: a drum pad for making beats with your fingers. Real recorded kits, a looper, a step grid and melodic pads.">
<title>Beat Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ebgaramond-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app" data-view="pads" data-mode="drums">
  <header class="top">
    <h1 class="brand">Beat Pad</h1>
    <button id="kitBtn" class="chip" aria-haspopup="dialog" aria-label="Choose sound">
      <span id="kitName">Acoustic</span> <svg class="i" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-haspopup="dialog" aria-label="Menu">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section class="transport" aria-label="Transport">
    <button id="playBtn" class="t-btn" aria-label="Play" aria-pressed="false">
      <svg class="i play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>
      <svg class="i stop" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
    </button>
    <button id="recBtn" class="t-btn rec" aria-label="Record" aria-pressed="false">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5" fill="currentColor"/></svg>
    </button>
    <button id="tempoBtn" class="tempo" aria-label="Tempo">
      <span id="bpmVal" class="num">92</span><span class="unit">bpm</span>
    </button>
    <button id="metBtn" class="t-btn small" aria-label="Metronome" aria-pressed="false">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 17h6l-2-13H9zM10 12l5-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
    <button id="undoBtn" class="t-btn small" aria-label="Undo last layer">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6 3.5 9.5 7 13M4 9.5h7.5a4 4 0 0 1 0 8H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="clearBtn" class="t-btn small" aria-label="Clear beat">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6h10M8 6V4h4v2M6.5 6l.8 10h5.4l.8-10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <div class="beats" id="beats" aria-hidden="true"></div>

  <nav class="views">
    <div class="seg" role="tablist" aria-label="View">
      <button role="tab" data-view="pads" aria-selected="true">Pads</button>
      <button role="tab" data-view="grid" aria-selected="false">Grid</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Sound">
      <button role="radio" data-mode="drums" aria-checked="true">Drums</button>
      <button role="radio" data-mode="bass" aria-checked="false">Bass</button>
      <button role="radio" data-mode="keys" aria-checked="false">Keys</button>
    </div>
  </nav>

  <main class="stage">
    <div id="melBar" class="melbar" hidden>
      <label>Key <select id="keySel" aria-label="Key"></select></label>
      <label>Scale <select id="scaleSel" aria-label="Scale"></select></label>
      <div class="oct"><button id="octDown" aria-label="Octave down">−</button><span id="octVal" class="num">0</span><button id="octUp" aria-label="Octave up">+</button></div>
    </div>
    <div id="pads" class="pads" aria-label="Pads"></div>
    <div id="grid" class="grid" aria-label="Step grid"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <footer class="strip">
    <label class="ctl">Snap
      <select id="quantSel" aria-label="Snap to beat">
        <option value="0">Off</option><option value="8">1/8</option><option value="16" selected>1/16</option><option value="24">1/16T</option>
      </select>
    </label>
    <label class="ctl swing">Swing <input id="swingIn" type="range" min="0" max="50" value="0" aria-label="Swing"><span id="swingVal" class="num">0%</span></label>
    <label class="ctl">Bars
      <select id="barsSel" aria-label="Loop length in bars"><option>1</option><option selected>2</option><option>4</option></select>
    </label>
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" data-close aria-label="Close">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="splash" class="splash">
  <div class="splash-in">
    <div class="splash-title">Beat Pad</div>
    <p>Sixteen pads, real drums, your fingers.</p>
    <button id="startBtn" class="big">Tap to start</button>
    <div id="loadBar" class="loadbar"><i></i></div>
  </div>
</div>

<script src="src/theory.js"></script>
<script src="src/core.js"></script>
<script src="src/engine.js"></script>
<script type="module" src="src/ui.js"></script>
</body>
</html>
